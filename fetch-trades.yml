name: Fetch Congressional Trades

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'

  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit data/trades.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so the commit author info works correctly
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The fetch script uses only stdlib (json, urllib, xml) — no pip needed.

      - name: Run fetch script
        run: python scripts/fetch_trades.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only commit if the data file actually changed
          if git diff --quiet data/trades.json; then
            echo "No new trades found — nothing to commit."
          else
            git add data/trades.json
            git commit -m "chore: update trades $(date -u +%Y-%m-%d)"
            git push
            echo "Committed and pushed updated trades.json"
          fi
